[package]
name = "dioxus-auth-derive"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Derive macro for the dioxus-auth AuthUser trait."
repository = "https://github.com/shedrackgodstime/dioxus-auth"
keywords = ["auth", "dioxus", "derive", "session"]
categories = ["authentication", "rust-patterns"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
dioxus-auth = { path = "../..", default-features = false }
