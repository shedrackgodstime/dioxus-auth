[advisories]
ignore = []

[licenses]
# BSD-3-Clause: subtle (crypto crate). Unicode-3.0: unicode-ident.
# ISC, Zlib, CC0-1.0: ubiquitous permissive transitive licenses
# (MIT-equivalent, zlib-licensed, public-domain dedication).
# BSL-1.0 is the Boost Software License (OSI-approved), not Business Source
# (that would be BUSL-1.1): xxhash-rust via dioxus-fullstack.
# CDLA-Permissive-2.0 covers Mozilla CA certificate DATA inside webpki-roots,
# not code; it is the only way rustls gets trust anchors. All five arrive
# transitively only. Re-audit this list if a direct dependency ever needs one.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[licenses.private]
registries = []
