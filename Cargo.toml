[package]
name = "dioxus-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shedrack Godstime <shedrackgodstime@gmail.com>"]
description = "Dioxus-native authentication and session management."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/shedrackgodstime/dioxus-auth"
documentation = "https://docs.rs/dioxus-auth"
keywords = ["auth", "dioxus", "session", "axum"]
categories = ["authentication", "web-programming"]
# Packaging whitelist — every pattern is ROOT-ANCHORED on purpose.
# Guarded by scripts/check-packaging.sh (CI job "Packaging guard"): keep the
# whitelist there in sync when editing this list.
# The previous `include = ["src/**", "crates/**", "Cargo.toml", "README.md",
# "LICENSE*"]` used unanchored gitignore-style patterns: `README.md` and
# `LICENSE*` matched those filenames at ANY depth, and the package walk
# followed the per-clone `scratch/` and `.agent-rules/` symlinks — shipping
# ~80 private knowledge-base files (vendored next-auth, agent rules) to
# crates.io. Found via `cargo package --list` before the real 0.1.0 publish.
#
# - `crates/**` is gone: cargo auto-excludes workspace-member packages from
#   the parent's tarball, so that entry never shipped anything (verified:
#   zero `crates/` files in `cargo package --list`). `dioxus-auth-derive`
#   stays dev-only and unpublished; its path-only dep on this crate has no
#   version, so it could not be published as-is anyway.
# - `tests/derive_auth_user.rs` is deliberately NOT listed: cargo strips the
#   path-only dev-dependency from the published manifest, so the shipped
#   test would not compile for anyone who vendors the crate. It still runs
#   in this workspace (`cargo test --all-features`).
include = [
    "/src/**",
    "/tests/auth_lifecycle_integration.rs",
    "/tests/concurrency_stress.rs",
    "/tests/sqlite_integration.rs",
    "/tests/transport_extract.rs",
    "/examples/basic_auth.rs",
    "/examples/sqlite_adapter.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[workspace]
members = ["crates/dioxus-auth-derive"]

[workspace.lints.rust]
# missing_docs is enforced via #![warn(missing_docs)] inside each lib target
# (src/lib.rs, crates/dioxus-auth-derive/src/lib.rs) so tests and examples
# are not held to library documentation standards.

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
cargo = "warn"
# Note: dioxus 0.7's own tree depends on both syn 2 (darling) and syn 3
# (async-trait). clippy::multiple_crate_versions is allowed in src/lib.rs
# because upstream duplication is not resolvable from this crate.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus"]
dioxus-fullstack = ["dioxus", "dioxus/fullstack", "dep:http"]
axum = ["dep:axum", "dep:tower", "dep:http"]

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash", "alloc"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
dioxus = { version = "0.7", default-features = false, features = ["hooks", "signals", "macro", "html", "router"], optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["BroadcastChannel", "console", "Location", "MessageEvent", "Window", "Storage"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dioxus-auth-derive = { path = "./crates/dioxus-auth-derive" }
serde_json = "1"

[[example]]
name = "basic_auth"
required-features = ["dioxus"]

[[example]]
name = "sqlite_adapter"
required-features = ["dioxus"]

[[test]]
name = "auth_lifecycle_integration"
required-features = ["dioxus"]
