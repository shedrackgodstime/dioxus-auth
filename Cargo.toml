[package]
name = "dioxus-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shedrack Godstime <shedrackgodstime@gmail.com>"]
description = "Dioxus-native authentication and session management."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/shedrackgodstime/dioxus-auth"
documentation = "https://docs.rs/dioxus-auth"
keywords = ["auth", "dioxus", "session", "axum"]
categories = ["authentication", "web-programming"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus"]

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash", "alloc"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
dioxus = { version = "0.7", default-features = false, features = ["hooks", "signals", "macro", "html", "router"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
