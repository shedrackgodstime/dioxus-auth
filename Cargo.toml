[workspace]
members = [".", "examples/sqlite-reference"]

[lints]
rust = { warnings = "deny" }
clippy = { pedantic = { level = "deny", priority = -1 }, nursery = "deny", cargo = "deny", suspicious = "deny", style = "deny", complexity = "deny", perf = "deny", mod_module_files = "deny", question_mark_used = "deny", implicit_return = "deny" }

[package]
name = "dioxus-auth"
version = "0.1.0"
edition = "2024"
# MSRV applies to the core library (default features) and is CI-gated in the
# dedicated "MSRV (1.85.0)" job (`cargo check/clippy --lib`). The `dioxus` and
# `dioxus-fullstack` layers follow the Dioxus ecosystem's MSRV, which is higher
# (upstream deps like yoke 0.8 under-declare their true rustc requirement), so
# those layers are gated on stable only. See the comment block in
# .github/workflows/ci.yml before touching this value.
rust-version = "1.85"
authors = ["Shedrack Godstime <shedrackgodstime@gmail.com>"]
description = "Dioxus-native authentication and session management."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/shedrackgodstime/dioxus-auth"
homepage = "https://github.com/shedrackgodstime/dioxus-auth"
documentation = "https://docs.rs/dioxus-auth"
keywords = ["auth", "dioxus", "session", "axum"]
categories = ["authentication", "web-programming"]
# Packaging whitelist — every pattern is ROOT-ANCHORED on purpose. Unanchored
# gitignore-style patterns match at ANY depth: `README.md` and `LICENSE*`
# matched those filenames inside the per-clone `scratch/` and `.agent-rules/`
# symlinks, which cargo's package walk follows even though git ignores them
# (v1 shipped ~80 private KB files this way; found via scripts/check-packaging.sh
# on 2026-09-21). Guarded by that script in the CI "Packaging" job — keep the
# script whitelist in sync when editing this list.
include = [
    "/.github/workflows/ci.yml",
    "/.gitignore",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/clippy.toml",
    "/rustfmt.toml",
    "/scripts/check-packaging.sh",
    "/scripts/check-ssot.sh",
    "/scripts/check-docs.sh",
    "/scripts/verify.sh",
    "/docs/README.md",
    "/docs/REVIEW.md",
    "/src/**",
]

[features]
default = []
dioxus = ["dep:dioxus", "dep:dioxus-core", "dep:dioxus-router", "dep:dioxus-signals"]
dioxus-fullstack = ["dioxus", "dep:dioxus-fullstack", "dep:serde", "dep:axum", "dep:tower", "dep:tokio"]
# Compile-phase gate for the server half of dioxus-fullstack-generated fns.
# dioxus-fullstack's `#[server]`/`#[post]` macros expand the wire call under
# `cfg(feature = "server")`; apps that declare their own fullstack fns must
# declare the same-named feature (dioxus's convention, see the macro docs).
server = ["dioxus-fullstack/server"]

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash", "alloc"] }
axum = { version = "0.8", optional = true }
dioxus = { version = "0.7", optional = true, default-features = false, features = ["hooks", "signals", "macro", "html"] }
dioxus-core = { version = "0.7", optional = true }
dioxus-fullstack = { version = "0.7", optional = true }
dioxus-router = { version = "0.7", optional = true, default-features = false, features = ["html"] }
dioxus-signals = { version = "0.7", optional = true }
hex = "0.4"
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["std"] }
rustc-hash = "2"
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", optional = true, features = ["rt"] }
tower = { version = "0.5", optional = true }

# getrandom 0.2 (pulled by rand_core 0.6) needs its `js` feature to compile on
# wasm32-unknown-unknown; without it `SessionId::generate` (OsRng) fails the
# wasm build with a compile_error! inside getrandom itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
dioxus-fullstack = { version = "0.7", features = ["server"] }
dioxus-history = "0.7"
dioxus-server = "0.7"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "auth_facade"
path = "tests/auth_facade.rs"
required-features = []

[[test]]
name = "conformance_user_store"
path = "tests/conformance/user_store.rs"

[[test]]
name = "conformance_password_store"
path = "tests/conformance/password_store.rs"

[[test]]
name = "conformance_session_store"
path = "tests/conformance/session_store.rs"

[[test]]
name = "concurrency_stress"
path = "tests/concurrency_stress.rs"
required-features = []

[[test]]
name = "core_engine"
path = "tests/core_engine/main.rs"
required-features = []

[[test]]
name = "public_api"
path = "tests/public_api/main.rs"
required-features = []

[[test]]
name = "dioxus_runtime"
path = "tests/dioxus_runtime/main.rs"
required-features = ["dioxus"]

[[test]]
name = "fullstack_tests"
path = "tests/fullstack_tests/main.rs"
required-features = ["dioxus-fullstack", "server"]

[[test]]
name = "fullstack_global_tests"
path = "tests/fullstack_global_tests.rs"
required-features = ["dioxus-fullstack", "server"]

# Compile-checked mirrors of the README quickstart snippets (review finding
# N9): plain snippets must fail CI when the documented API drifts.
[[test]]
name = "readme_snippets"
path = "tests/readme_snippets.rs"
required-features = []
