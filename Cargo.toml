[package]
name = "dioxus-auth"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Shedrack Godstime <shedrackgodstime@gmail.com>"]
description = "Dioxus-native authentication and session management."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/shedrackgodstime/dioxus-auth"
documentation = "https://docs.rs/dioxus-auth"
keywords = ["auth", "dioxus", "session", "axum"]
categories = ["authentication", "web-programming"]
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/docs/DESIGN.md",
    "/src/**/*.rs",
]

[features]
default = ["dioxus"]
dioxus = ["dep:dioxus"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["hooks", "signals", "macro", "html", "router"], optional = true }

[dev-dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt"] }
