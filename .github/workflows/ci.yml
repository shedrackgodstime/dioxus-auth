name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt -- --check
      # `--pedantic` is a clippy flag and belongs after the `--` separator;
      # before it, cargo rejects the argument and the step never ran.
      - name: Check clippy
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic
      - name: Test all targets
        run: cargo test --all-targets
      - name: Test dioxus feature
        run: cargo test --all-targets --features dioxus
      - name: Test fullstack server features
        run: cargo test --all-targets --features dioxus-fullstack,server
      - name: Test doc
        run: cargo test --doc

  msrv:
    # MSRV gate: the core library (default features) must build on the
    # declared rust-version. Scoped to `--lib` because upstream dioxus deps
    # (yoke 0.8 declares rust-version "1.82" but its proc-macro needs an API
    # stabilized after 1.85) cannot compile on 1.85 even under MSRV-aware
    # resolution. The dioxus/fullstack layers follow Dioxus's MSRV, not ours,
    # and are fully gated on stable above.
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt -- --check
      - name: Check library on MSRV
        run: cargo check --lib
      - name: Check clippy on MSRV
        run: cargo clippy --lib -- -D warnings -W clippy::pedantic

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      # No lockfile is committed: jobs resolve dependencies fresh, and
      # MSRV-aware resolution (rust-version = 1.85) would pin `time` below
      # the RUSTSEC-2026-0009 fix line (>= 0.3.47). Advisories must be
      # judged on the newest resolution, not the MSRV-capped one.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Run cargo deny
        run: cargo deny check --config .cargo/deny.toml

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate docs
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging
        run: bash scripts/check-packaging.sh

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --out Xml --fail-under 60
