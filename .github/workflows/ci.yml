name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.85.0
        features:
          - "--features dioxus"
          - "--features dioxus-fullstack"
          - "--features axum"
          - "--no-default-features"
        exclude:
          - rust: 1.85.0
            features: "--features dioxus-fullstack"
      include:
          - rust: stable
            features: "--all-targets --features dioxus"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt -- --check
      - name: Check clippy
        run: cargo clippy ${{ matrix.features }} -- -D warnings
      - name: Run tests
        run: cargo test ${{ matrix.features }}
      - name: Run doc tests
        if: matrix.features == '--all-targets --features dioxus' || matrix.features == '--all-targets --features dioxus-fullstack'
        run: cargo test --doc --features dioxus

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo deny
        run: cargo deny check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate docs
        run: RUSTDODFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps --features dioxus
